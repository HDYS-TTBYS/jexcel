name: Release

# v で始まるタグ（例: v0.2.0）を push すると、3 OS のインストーラを作って GitHub Releases に下書きとして載せる。
# 下書きの内容を確かめてから、Releases の画面で公開する。手順は docs/releasing.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: タグとバージョンの一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: バージョンを照合
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$tag tauri.conf.json=$conf Cargo.toml=$cargo"
          test "$tag" = "$conf" && test "$tag" = "$cargo"

  test:
    name: テスト（${{ matrix.os }}）
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  publish:
    name: インストーラ（${{ matrix.os }}）
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
      - name: Linux 依存パッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm --dir ui install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: jxcel ${{ github.ref_name }}
          releaseBody: |
            変更点は各コミットを参照してください。コード署名はしていません（初回起動時に OS の警告が出ます。docs/install.md）。
          releaseDraft: true
          prerelease: false
      # タグなしの手動実行では Releases に載せず、成果物として残す
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          retention-days: 7
