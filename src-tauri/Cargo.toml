[package]
name = "jxcel"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "jxcel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
jxcel-app = { path = "../crates/jxcel-app" }
jxcel-core = { path = "../crates/jxcel-core" }
jxcel-git = { path = "../crates/jxcel-git" }
jxcel-macro = { path = "../crates/jxcel-macro" }

# ルートの workspace とは別にビルドする（WebKit 等のシステム依存があるため）
[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
