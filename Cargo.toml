[workspace]
resolver = "2"
members = ["crates/jxcel-core", "crates/jxcel-git", "crates/jxcel-app"]
# src-tauri は WebKit 等のシステム依存が必要なため、独立したルートとして扱う
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
