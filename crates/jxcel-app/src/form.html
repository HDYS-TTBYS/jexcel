<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォーム</title>
<style>
  :root { color-scheme: light dark; --bd: #d1d5db; --fg: #111827; --bg: #f3f4f6; --card: #fff; --accent: #2563eb; --err: #b91c1c; --ok: #15803d; }
  @media (prefers-color-scheme: dark) { :root { --bd: #374151; --fg: #f3f4f6; --bg: #111827; --card: #1f2937; --accent: #60a5fa; --err: #f87171; --ok: #4ade80; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  main { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .desc { margin: 0 0 16px; color: #6b7280; white-space: pre-wrap; }
  label { display: block; font-weight: 600; margin-top: 14px; }
  .req { color: var(--err); margin-left: 4px; }
  input, select { font-weight: 400; width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--bd); border-radius: 8px; }
  input[type=checkbox] { width: auto; margin-right: 8px; transform: scale(1.3); }
  label.check { font-weight: 600; display: flex; align-items: center; }
  button { margin-top: 20px; width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button.secondary { margin-top: 10px; background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; white-space: pre-wrap; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">読み込み中…</h1>
  <p class="desc" id="desc" hidden></p>
  <form id="form" novalidate></form>
  <div class="msg" id="msg" role="status"></div>
</main>
<script>
"use strict";
const base = location.pathname.replace(/\/+$/, "");
const $ = (id) => document.getElementById(id);
const msg = (text, cls) => { const m = $("msg"); m.textContent = text; m.className = "msg " + (cls || ""); };
let fields = [];
const inputs = {};

function build(def) {
  document.title = def.title;
  $("title").textContent = def.title;
  if (def.description) { $("desc").textContent = def.description; $("desc").hidden = false; }
  const form = $("form");
  form.textContent = "";
  fields = def.fields;
  for (const f of fields) {
    const label = document.createElement("label");
    let input;
    if (f.kind === "bool") {
      label.className = "check";
      input = document.createElement("input");
      input.type = "checkbox";
      label.append(input, f.label);
    } else {
      label.append(f.label);
      if (f.kind === "enum") {
        input = document.createElement("select");
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "選択してください";
        input.append(blank);
        for (const v of f.options) {
          const o = document.createElement("option");
          o.value = v;
          o.textContent = v;
          input.append(o);
        }
      } else {
        input = document.createElement("input");
        input.type = { int: "number", float: "number", date: "date", dateTime: "datetime-local" }[f.kind] || "text";
        if (f.kind === "int") input.step = "1";
        if (f.kind === "float") input.step = "any";
        if (f.kind === "decimal") input.inputMode = "decimal";
      }
      label.append(input);
    }
    if (f.required) {
      const r = document.createElement("span");
      r.className = "req";
      r.textContent = "*";
      label.insertBefore(r, input.type === "checkbox" ? null : input);
    }
    inputs[f.id] = input;
    form.append(label);
  }
  const btn = document.createElement("button");
  btn.type = "submit";
  btn.textContent = "送信";
  form.append(btn);
  const fresh = document.createElement("button");
  fresh.type = "button";
  fresh.className = "secondary";
  fresh.id = "fresh";
  fresh.hidden = true;
  fresh.textContent = "新しい回答として送る";
  fresh.onclick = startNew;
  form.append(fresh);
}

// 送信済みの回答の修正。サーバーが送信のたびに渡す修正用トークンをこの端末に覚え、
// 開き直したときも同じ回答を直せる（トークンを知らない人は直せない。配信を止めると無効になる）
let editToken = "";
try { editToken = localStorage.getItem("jxcel-edit:" + base) || ""; } catch (_) {}
function keepEdit(t) {
  editToken = t || "";
  try { editToken ? localStorage.setItem("jxcel-edit:" + base, editToken) : localStorage.removeItem("jxcel-edit:" + base); } catch (_) {}
}
function setMode() {
  const editing = !!editToken;
  $("form").querySelector("button[type=submit]").textContent = editing ? "修正を送信" : "送信";
  $("fresh").hidden = !editing;
}
function fill(values) {
  for (const f of fields) {
    const el = inputs[f.id], v = values[f.id];
    if (f.kind === "bool") { el.checked = v === true; continue; }
    if (v === undefined || v === null) { el.value = ""; continue; }
    // 日時は書かれたままの時刻（オフセットは付け直す）。入力欄は分まで
    el.value = f.kind === "dateTime" ? String(v).slice(0, 16) : String(v);
  }
}
function startNew() {
  keepEdit("");
  $("form").reset();
  setMode();
  msg("");
}
async function loadAnswer() {
  if (!editToken) return;
  try {
    const res = await fetch(base + "/answer", { headers: headers({ "x-jxcel-edit": editToken }) });
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      fill(body.values || {});
      setMode();
      msg("送信済みの回答です。直す場合は内容を変えて「修正を送信」を押してください。", "");
    } else if (res.status === 404) { keepEdit(""); setMode(); }
  } catch (_) {}
}

function collect() {
  const values = {};
  for (const f of fields) {
    const el = inputs[f.id];
    if (f.kind === "bool") { values[f.id] = el.checked; continue; }
    const v = el.value.trim();
    if (v === "") continue;
    if (f.kind === "dateTime") {
      // ブラウザの入力にはタイムゾーンが無いので、この端末のタイムゾーンのオフセット（その日時の時点のもの）を付けて送る。
      // 例: 日本の端末で 10:30 と入力 → "2026-10-02T10:30:00+09:00"。回答者が入力したとおりの時刻が残る
      const d = new Date(v);
      if (isNaN(d.getTime())) throw new Error(f.label + ": 日時が正しくありません");
      const min = -d.getTimezoneOffset();
      const a = Math.abs(min);
      const off = (min < 0 ? "-" : "+") + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
      values[f.id] = (v.length === 16 ? v + ":00" : v) + off;
    } else values[f.id] = v;
  }
  return values;
}

async function onSubmit(e) {
  e.preventDefault();
  const btn = $("form").querySelector("button");
  let values;
  try { values = collect(); } catch (err) { msg(err.message, "err"); return; }
  btn.disabled = true;
  msg("送信中…");
  try {
    const editing = !!editToken;
    const res = await fetch(base + (editing ? "/edit" : "/submit"), {
      method: "POST",
      headers: headers(Object.assign({ "content-type": "application/json" }, editing ? { "x-jxcel-edit": editToken } : {})),
      body: JSON.stringify({ values }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 && body.needCode) { code = ""; return askCode("合言葉が変わりました。もう一度入力してください"); }
    if (editing && res.status === 404) {
      // 配信が再開された・回答が表から消えた。新しい回答として送り直してもらう
      startNew();
      throw new Error("この回答はもう修正できません。内容を確かめて、新しい回答として送信してください。");
    }
    if (!res.ok) throw new Error(body.error || "送信に失敗しました（" + res.status + "）");
    if (editing) {
      msg("修正を送信しました。", "ok");
    } else {
      // 続けて直せるように、内容は残したまま修正の状態にする
      if (body.editToken) { keepEdit(body.editToken); setMode(); }
      else $("form").reset();
      msg(body.editToken ? "送信しました。ありがとうございました。\n内容を直すときは、そのまま変えて「修正を送信」を押してください。" : "送信しました。ありがとうございました。", "ok");
    }
  } catch (err) {
    msg(err.message, "err");
  } finally {
    btn.disabled = false;
  }
}

// 合言葉。ヘッダで送る（URL に載せない）。このタブを閉じるまで覚える
let code = "";
try { code = sessionStorage.getItem("jxcel-code:" + base) || ""; } catch (_) {}
const headers = (extra) => Object.assign({}, extra, code ? { "x-jxcel-code": code } : {});

function askCode(message) {
  $("title").textContent = "合言葉が必要です";
  $("desc").hidden = true;
  const form = $("form");
  form.textContent = "";
  fields = [];
  const label = document.createElement("label");
  label.append("合言葉");
  const input = document.createElement("input");
  input.type = "password";
  input.autocomplete = "off";
  input.setAttribute("aria-label", "合言葉");
  label.append(input);
  const btn = document.createElement("button");
  btn.type = "submit";
  btn.textContent = "開く";
  form.append(label, btn);
  form.onsubmit = (e) => {
    e.preventDefault();
    code = input.value.trim();
    try { sessionStorage.setItem("jxcel-code:" + base, code); } catch (_) {}
    msg("");
    load();
  };
  msg(message || "", message ? "err" : "");
  input.focus();
}

async function load() {
  try {
    const res = await fetch(base + "/def", { headers: headers() });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 && body.needCode) { code = ""; return askCode(body.error === "合言葉が違います" ? body.error : ""); }
    if (!res.ok) throw new Error(body.error || "フォームを読み込めません（" + res.status + "）");
    $("form").onsubmit = onSubmit;
    build(body);
    setMode();
    loadAnswer();
  } catch (err) { $("title").textContent = "フォームを開けません"; msg(err.message, "err"); }
}
load();
</script>
</body>
</html>
